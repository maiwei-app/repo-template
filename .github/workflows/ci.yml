name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  not-initialized:
    if: github.repository != 'maiwei-app/repo-template'
    runs-on: ubuntu-latest
    steps:
      - name: This repo's CI has not been initialized
        run: |
          echo "::error::Este repo no tiene CI todavía."
          echo "Lee la política: https://app.notion.com/p/colomr/Calidad-del-C-digo-3d5c368461ee8126b387fb8329f703f6"
          echo "Luego dile al modelo: \"inicializa el CI de este repo\" — seguirá scripts/sw-quality-checks.md."
          exit 1

  lint-yaml:
    if: github.repository == 'maiwei-app/repo-template'
    uses: maiwei-app/workflows/.github/workflows/lint-yaml.yml@main
